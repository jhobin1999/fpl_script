name: Run FPL Weekly Script

on:
  schedule:
    # This runs every Tuesday at 9:00 AM UTC (adjust as needed for gameweeks)
    - cron: '0 9 * * 2'
  workflow_dispatch: # Allows you to manually trigger it from your phone/browser anytime!

permissions:
  contents: write  # <-- THIS IS REQUIRED so the script can push code back!

jobs:
  run-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run the FPL script
        run: |
          python send_email.py